<!doctype html>
<!--
  SKILL: Register — where is each drawing, which model, which typology,
  and what happened to it in every submission.
  ─────────────────────────────────────────────────────────────────────
  Uploads:  1. MIDP (INT tab, or pick the columns)   — the master list
            2. Model list (optional, any layout)     — models + typologies
            3. Submission lists (one per submission) — history only
  Rule:     the revision shown is ALWAYS the MIDP's; submissions only add
            "became T2 at PTA #3". It changes only when a new MIDP is uploaded.
  Brain:    register-core.js (dates, numbers, matching — tested on its own)
  Data:     localStorage "lt_dreg_v1" — belongs to the open project
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register</title>
<style>
/* ---------- 1. Colours (Gold; other skins come from core/theme.css) ---------- */
:root {
  color-scheme: dark;
  --bg:#070807; --bg2:#10120f; --panel:rgba(18,20,16,.88); --soft:rgba(255,255,255,.05); --soft2:rgba(255,255,255,.09);
  --ink:#f8f2e8; --muted:#aaa297; --line:rgba(255,255,255,.13); --accent:#d8b76d; --accent2:#ff9655; --accent-ink:#070807;
  --green:#97dc8d; --red:#ff7474; --amber:#f0c674; --blue:#7fb3ff; --edge:#000;
  --shadow:0 18px 55px rgba(0,0,0,.34); --r:16px; --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,Menlo,monospace;
}
html[data-lt-mode="light"] {
  color-scheme: light;
  --bg:#eef1ed; --bg2:#f7f8f4; --panel:rgba(251,250,244,.95); --soft:rgba(40,56,60,.05); --soft2:rgba(40,56,60,.09);
  --ink:#202521; --muted:#5a6360; --line:rgba(40,56,60,.15); --accent:#a07830; --accent2:#cc6622; --accent-ink:#fff;
  --green:#2f8a4e; --red:#d23b3b; --amber:#b07b1e; --blue:#1f6fb8; --edge:#202521; --shadow:0 18px 45px rgba(65,75,70,.12);
}
/* ---------- 2. Base ---------- */
* { box-sizing: border-box; }
body { margin: 0; padding: 12px 14px 40px; font: 14px/1.45 var(--font); color: var(--ink); min-height: 100vh;
  background: radial-gradient(circle at 10% 0%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 36%), linear-gradient(145deg, var(--bg), var(--bg2)); }
button, input, select, textarea { font: inherit; color: inherit; }
input, select { background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; color: var(--ink); min-width: 0; }
select option { background: var(--bg2); color: var(--ink); }
.small { font-size: 12px; color: var(--muted); }
.mono { font-family: var(--mono); }
[hidden] { display: none !important; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--soft); color: var(--ink); cursor: pointer; font-weight: 600; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: color-mix(in srgb, var(--accent) 55%, transparent); background: var(--soft2); }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); border-color: transparent; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.btn.danger { color: var(--red); }
.icon { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--soft); cursor: pointer; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
/* ---------- 3. Header + tabs ---------- */
.top { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.brand { display: flex; gap: 10px; align-items: center; }
.logo { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--accent-ink); }
h1 { margin: 0; font-size: 19px; }
.counts { display: flex; gap: 6px; flex-wrap: wrap; }
.counts span { font-size: 12px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--soft); color: var(--muted); }
.counts b { color: var(--ink); }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.tabs button { border: 1px solid var(--line); background: var(--soft); color: var(--muted); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; }
.tabs button.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.tabs .badge { margin-left: 6px; font-size: 11px; padding: 0 6px; border-radius: 99px; background: var(--red); color: #fff; }
/* ---------- 4. Search + one-line results ---------- */
.searchbar { display: flex; gap: 8px; margin-bottom: 8px; }
.searchbar input { flex: 1; font-size: 16px; padding: 11px 14px; border-radius: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); cursor: pointer; color: var(--muted); }
.chip.on { border-color: var(--accent); color: var(--ink); background: color-mix(in srgb, var(--accent) 16%, transparent); }
.group { margin-bottom: 12px; overflow: hidden; }
.group h3 { margin: 0; padding: 9px 12px; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
.row { display: grid; grid-template-columns: minmax(150px, 230px) minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 12px; border-bottom: 1px solid color-mix(in srgb, var(--line) 55%, transparent); cursor: pointer; }
.row:last-child { border-bottom: 0; }
.row:hover { background: var(--soft); }
.row .id { font: 600 12px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tt small { color: var(--muted); margin-left: 6px; }
.row .tags { display: flex; gap: 5px; align-items: center; justify-content: flex-end; flex-wrap: nowrap; }
.tag { font-size: 11.5px; padding: 1px 8px; border-radius: 99px; background: var(--soft2); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.tag.rev { font-family: var(--mono); font-weight: 700; background: color-mix(in srgb, var(--accent) 20%, transparent); }
.tag.sent { color: var(--green); } .tag.late { color: var(--red); } .tag.none { color: var(--muted); }
.more { padding: 8px 12px; text-align: center; }
.empty { padding: 30px 16px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
@media (max-width: 760px) {
  body { padding: 8px 8px 30px; }
  .counts, .brand .small { display: none; }
  .top .btn { padding: 5px 9px; font-size: 12px; }
  .tabs button { padding: 5px 10px; font-size: 12.5px; }
  .row { grid-template-columns: 1fr; gap: 3px; }
  .row .tags { justify-content: flex-start; flex-wrap: wrap; }
}
/* confidence marks */
.c-sure::before { content: "✅ "; } .c-likely::before { content: "🟡 "; } .c-check::before { content: "⚠ "; } .c-none::before { content: "❓ "; }
/* ---------- 5. Detail panel ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 100%); background: var(--bg2); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 30; overflow: auto; padding: 16px; transform: translateX(105%); transition: transform .2s; }
.drawer.show { transform: none; }
.drawer h2 { margin: 0 0 4px; font-size: 16px; word-break: break-all; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; margin: 12px 0; font-size: 13px; }
.kv > span:nth-child(odd) { color: var(--muted); }
.sec { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
.sec h4 { margin: 0 0 6px; font-size: 13px; }
.why { font-size: 12px; color: var(--muted); }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { padding: 5px 0 5px 14px; border-left: 2px solid var(--line); position: relative; font-size: 13px; }
.tl li::before { content: ""; position: absolute; left: -5px; top: 11px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.stages { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; font-size: 12.5px; }
.stages .past { color: var(--muted); } .stages .nx { color: var(--accent); font-weight: 700; }
.flag { font-size: 12.5px; padding: 6px 9px; border-radius: 9px; background: color-mix(in srgb, var(--amber) 13%, transparent); border: 1px solid color-mix(in srgb, var(--amber) 35%, transparent); margin-top: 6px; }
.pick { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.pick select { flex: 1; min-width: 160px; }
.mini { max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 10px; }
.mini .row { grid-template-columns: minmax(120px, 190px) 1fr; }
/* ---------- 6. Pop-up, forms, tables ---------- */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; padding: 26px 12px; z-index: 40; overflow: auto; }
.modal.show { display: flex; }
.modal-card { width: min(860px, 100%); background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 18px; }
.modal-card h2 { margin: 0 0 10px; font-size: 17px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.form { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.form label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th, table.t td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
.tw { overflow: auto; max-height: 300px; border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
.foot { display: flex; justify-content: space-between; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); }
.box { padding: 14px; margin-bottom: 12px; }
.box h3 { margin: 0 0 8px; font-size: 15px; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%) translateY(20px); background: var(--bg2); border: 1px solid var(--line); padding: 9px 16px; border-radius: 99px; opacity: 0; transition: .25s; pointer-events: none; z-index: 60; box-shadow: var(--shadow); }
.toast.show { opacity: 1; transform: translateX(-50%); }
/* 8-bit skins */
html.lt-pixel .tabs button, html.lt-pixel .chip, html.lt-pixel .tag, html.lt-pixel .counts span { border-radius: 0 !important; }
html.lt-pixel .tabs button { border: 2px solid var(--edge); box-shadow: 2px 2px 0 var(--edge); font-family: var(--px-font); font-size: 11px; }
html.lt-pixel .row .id, html.lt-pixel .tag.rev { font-family: var(--px-font); font-weight: 400; }
html.lt-pixel .drawer { border-left: 3px solid var(--edge); }
html.lt-pixel .logo { background: var(--accent); }
</style>
<link rel="stylesheet" href="../../core/theme.css">
<script src="../../core/theme.js"></script>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">▤</span><div><h1>Register</h1><div class="small" id="projName"></div></div></div>
  <div class="counts" id="counts"></div>
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <button class="btn primary" data-act="upMidp">⬆ MIDP</button>
    <button class="btn" data-act="upModels">⬆ Model list</button>
    <button class="btn" data-act="upSub">⬆ Submission</button>
    <button class="btn" data-act="export">⬇ Excel</button>
    <button class="icon" id="themeBtn" title="Light / dark">☀</button>
  </div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="search" class="on">🔍 Search</button>
  <button data-tab="check">✔ Check</button>
  <button data-tab="models">▦ Models</button>
  <button data-tab="subs">📦 Submissions</button>
  <button data-tab="setup">⚙ Setup</button>
</nav>
<main id="main"></main>
<aside class="drawer" id="drawer"></aside>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fMidp" accept=".xlsx,.xlsm,.xls" hidden>
<input type="file" id="fModels" accept=".xlsx,.xlsm,.xls,.csv" hidden>
<input type="file" id="fSub" accept=".xlsx,.xlsm,.xls,.csv,.pdf,.dwg" multiple hidden>

<script src="register-core.js"></script>
<script>
(function () {
  'use strict';
  var C = window.RegCore, KEY = 'lt_dreg_v1', UIKEY = 'lt_dreg_ui_v1';
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function readJSON(k, d) { try { var v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  function now() { return new Date().toISOString(); }
  function todayIso() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function uid() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('show'); }, 2800); }

  /* ===== 1. Saved data ===== */
  function load() {
    var s = readJSON(KEY, null) || {};
    s.version = 1; s.midp = s.midp || null; s.models = s.models || null; s.subs = s.subs || [];
    s.overrides = s.overrides || { model: {}, typo: {} }; s.overrides.model = s.overrides.model || {}; s.overrides.typo = s.overrides.typo || {};
    s.rules = s.rules || []; s.codes = s.codes || Object.assign({}, C.DEFAULT_CODES); s.history = s.history || []; s.log = s.log || [];
    s.settings = s.settings || { monthFirst: false };
    return s;
  }
  var S = load(), IX = null;
  var UI = Object.assign({ tab: 'search', q: '', chip: '', showAll: {} }, readJSON(UIKEY, {}));
  function save(what) {
    try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem('lt_dreg_updated', now()); }
    catch (e) { toast('⚠ Could not save — browser storage is full'); return; }
    try { if (window.parent !== window && window.parent.__trackerEmbedSaved) window.parent.__trackerEmbedSaved('register'); } catch (e) {}
  }
  function saveUI() { try { localStorage.setItem(UIKEY, JSON.stringify({ tab: UI.tab, q: UI.q, chip: UI.chip })); } catch (e) {} }
  function log(text) { S.log.push({ at: now(), text: text }); if (S.log.length > 300) S.log.shift(); }
  function rebuild() { IX = C.buildIndex(S, todayIso()); }
  function project() {
    var pj = readJSON('lt_projects_v1', null), cur = pj && pj.list && pj.list.filter(function (p) { return p.id === pj.active; })[0];
    return cur || { name: '', code: '' };
  }

  /* ===== 2. Screens ===== */
  function render() {
    rebuild();
    var p = project();
    $('projName').textContent = (p.code ? p.code + ' — ' : '') + (p.name || '') + (S.midp ? ' · MIDP ' + S.midp.file : '');
    var checks = checkLists();
    $('counts').innerHTML = S.midp ? '<span><b>' + IX.drawings.length + '</b> drawings</span><span><b>' + IX.models.length + '</b> models</span><span><b>' + IX.typologies.length + '</b> typologies</span><span><b>' + S.subs.length + '</b> submissions</span>' : '';
    document.querySelectorAll('#tabs button').forEach(function (b) {
      var t = b.getAttribute('data-tab'); b.classList.toggle('on', t === UI.tab);
      if (t === 'check') b.innerHTML = '✔ Check' + (checks.todo ? '<span class="badge">' + checks.todo + '</span>' : '');
    });
    if (!S.midp && UI.tab !== 'setup') {
      $('main').innerHTML = '<div class="card empty"><b>Start by uploading the MIDP</b>The INT tab is found by itself, or you choose the columns.<br><br>' +
        '<button class="btn primary" data-act="upMidp">⬆ Upload MIDP</button><br><br><span class="small">Then (optional) the model list, and a submission list for each submission.</span></div>';
      return;
    }
    if (UI.tab === 'check') renderCheck(checks); else if (UI.tab === 'models') renderModels(); else if (UI.tab === 'subs') renderSubs(); else if (UI.tab === 'setup') renderSetup(); else renderSearch();
  }

  /* --- one-line rows --- */
  function confCls(c) { return c === 'sure' ? 'c-sure' : c === 'likely' ? 'c-likely' : c === 'check' ? 'c-check' : 'c-none'; }
  function modelLabel(num) { var m = num && IX.modelByNum[num.toUpperCase()]; return m ? (m.name || m.num) : (num || ''); }
  function dRow(d) {
    var last = d.lastSub, sent = last ? '<span class="tag sent" title="Last submission">' + esc(last.sub) + (last.rev ? ' · ' + esc(last.rev) : '') + '</span>' : (d.overdue ? '<span class="tag late" title="Due ' + esc(C.fmtDate(d.overdue.date)) + ' (' + esc(d.overdue.name) + ')">due, not sent</span>' : '<span class="tag none">not sent</span>');
    return '<div class="row" data-open="d:' + esc(d.key) + '"><span class="id" title="' + esc(d.num) + '">' + esc(d.key) + '</span>' +
      '<span class="tt">' + esc(d.title) + (d.typology.name ? '<small class="' + confCls(d.typology.conf) + '">' + esc(d.typology.name) + '</small>' : '') + '</span>' +
      '<span class="tags"><span class="tag ' + confCls(d.model.conf) + '" title="' + esc(d.model.why) + '">' + esc(d.model.num ? modelLabel(d.model.num) : 'no model') + '</span>' +
      '<span class="tag rev" title="MIDP revision">' + esc(d.rev || '—') + '</span>' + sent + '</span></div>';
  }
  function mRow(m) {
    return '<div class="row" data-open="m:' + esc(m.num) + '"><span class="id">' + esc(m.num) + '</span><span class="tt">' + esc(m.name || '') +
      '<small>' + esc(Object.keys(m.blds || {}).join(', ') || C.bldName(m.bld, S.codes)) + '</small></span>' +
      '<span class="tags"><span class="tag">' + m.drawings.length + ' drawings</span><span class="tag sent">' + m.sent + ' sent</span>' + (Object.keys(m.typos).length ? '<span class="tag">' + Object.keys(m.typos).length + ' typologies</span>' : '') + '</span></div>';
  }
  function tRow(t) {
    return '<div class="row" data-open="t:' + esc(t.name) + '"><span class="id">' + esc(Object.keys(t.blds).join(', ')) + '</span><span class="tt">' + esc(t.name) + '</span>' +
      '<span class="tags"><span class="tag">' + t.drawings.length + ' drawings</span>' + (Object.keys(t.models).length ? '<span class="tag">' + esc(Object.keys(t.models).map(modelLabel).join(', ')) + '</span>' : '<span class="tag none">no model</span>') + '</span></div>';
  }
  function group(id, title, list, rowFn, cap) {
    if (!list.length) return '';
    cap = cap || 8;
    var all = UI.showAll[id], shown = all ? list : list.slice(0, cap);
    return '<section class="card group"><h3><span>' + esc(title) + ' · ' + list.length + '</span>' + (list.length > cap ? '<button class="btn sm" data-all="' + id + '">' + (all ? 'Show less' : 'Show all') + '</button>' : '') + '</h3>' +
      shown.map(rowFn).join('') + '</section>';
  }

  /* --- Search --- */
  var CHIPS = [['', 'Everything'], ['notsent', 'Not sent'], ['due', 'Due, not sent'], ['nomodel', 'No model'], ['notypo', 'No typology'], ['flag', 'Has a warning']];
  function chipFilter(d) {
    return UI.chip === 'notsent' ? !d.history.length : UI.chip === 'due' ? !!d.overdue : UI.chip === 'nomodel' ? !d.model.num : UI.chip === 'notypo' ? !d.typology.name : UI.chip === 'flag' ? d.flags.length > 0 : true;
  }
  function renderSearch() {
    var q = UI.q.trim(), res;
    if (q) res = C.search(IX, q); else res = { drawings: UI.chip ? IX.drawings : [], models: [], typologies: [] };
    var dr = res.drawings.filter(chipFilter);
    var html = '<div class="searchbar"><input id="q" type="search" placeholder="Drawing no., title, model, typology, L16, T1, PLN…" value="' + esc(UI.q) + '" autocomplete="off"></div>' +
      '<div class="chips">' + CHIPS.map(function (c) { return '<span class="chip' + (UI.chip === c[0] ? ' on' : '') + '" data-chip="' + c[0] + '">' + c[1] + '</span>'; }).join('') + '</div>';
    if (!q && !UI.chip) html += '<div class="card empty"><b>Type to search</b>Every word must match — e.g. <span class="mono">10100</span>, <span class="mono">1 BR res.1</span>, <span class="mono">L3 PLN</span>, <span class="mono">Tower 2 suite</span>.<br><span class="small">Tap a line for its model, typology, dates and submission history.</span></div>';
    else if (!dr.length && !res.models.length && !res.typologies.length) html += '<div class="card empty"><b>Nothing found</b>Try fewer words.</div>';
    else html += group('d', 'Drawings', dr, dRow) + group('m', 'Models', res.models, mRow, 5) + group('t', 'Typologies', res.typologies, tRow, 5);
    $('main').innerHTML = html;
    var inp = $('q'); inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
  }

  /* --- Check --- */
  function checkLists() {
    if (!IX || !S.midp) return { todo: 0 };
    var D = IX.drawings;
    var L = {
      mCheck: D.filter(function (d) { return d.model.conf === 'check'; }),
      mLikely: D.filter(function (d) { return d.model.conf === 'likely'; }),
      tLikely: D.filter(function (d) { return d.typology.conf === 'likely'; }),
      tCheck: D.filter(function (d) { return d.typology.conf === 'check'; }),
      noModel: D.filter(function (d) { return !d.model.num && d.model.conf !== 'check'; }),
      flags: D.filter(function (d) { return d.flags.length; }),
      due: D.filter(function (d) { return d.overdue; }),
      issues: (S.midp.issues || []), notInMidp: IX.notInMidp
    };

  var xlsxReady = null;
  function loadXLSX() {
    if (window.XLSX) return Promise.resolve();
    return xlsxReady || (xlsxReady = new Promise(function (res, rej) { var s = document.createElement('script'); s.src = '../../lib/xlsx.full.min.js'; s.onload = res; s.onerror = function () { xlsxReady = null; rej(new Error('Excel reader did not load')); }; document.head.appendChild(s); }));
  }
  function readBook(file) {
    return Promise.all([loadXLSX(), file.arrayBuffer()]).then(function (r) {
      var wb = XLSX.read(new Uint8Array(r[1]), { type: 'array' }), out = {};
      wb.SheetNames.forEach(function (n) {
        var ws = wb.Sheets[n]; if (!ws['!ref']) { out[n] = { rows: [], off: 0 }; return; }
        var range = XLSX.utils.decode_range(ws['!ref']);
        out[n] = { rows: XLSX.utils.sheet_to_json(ws, { header: 1, defval: null, raw: true, blankrows: true }), off: range.s.r };
      });
      return out;
    });
  }

      '<h4>Revision changes</h4>' + li(diff.rev, function (x) { return '<tr><td class="mono">' + esc(x.key) + '</td><td class="mono">' + esc(x.from || '—') + ' → ' + esc(x.to || '—') + '</td></tr>'; }) +
      '<h4>Dates moved</h4>' + li(diff.dates, function (x) { return '<tr><td class="mono">' + esc(x.key) + '</td><td>' + esc(x.stage) + '</td><td>' + esc(C.fmtDate(x.from) || '—') + ' → ' + esc(C.fmtDate(x.to) || '—') + '</td><td class="' + (x.days > 0 ? 'bad' : 'ok') + '">' + (x.days != null ? (x.days > 0 ? '+' : '') + x.days + ' days' : '') + '</td></tr>'; }) +
      '<h4>New drawings</h4>' + li(diff.added, function (k) { return '<tr><td class="mono">' + esc(k) + '</td></tr>'; }) +
      '<h4>Removed drawings</h4>' + li(diff.removed, function (k) { return '<tr><td class="mono">' + esc(k) + '</td></tr>'; }) +
      '<h4>Title changes</h4>' + li(diff.title, function (x) { return '<tr><td class="mono">' + esc(x.key) + '</td><td>' + esc(x.from) + ' → <b>' + esc(x.to) + '</b></td></tr>'; }) +
      '<div class="foot"><span></span><button class="btn primary" data-close>OK</button></div>');
  }

  /* --- Model list --- */
  var ML = null;
  function modelsFile(file) {
    readBook(file).then(function (book) {
      var name = Object.keys(book).filter(function (n) { return C.detectModelLayout(book[n].rows).num >= 0; })[0] || Object.keys(book)[0];
      ML = { file: file.name, book: book, sheet: name, L: C.detectModelLayout(book[name].rows) };
      modelsPreview();
    }).catch(function (e) { toast('⚠ ' + e.message); });
  }
  function modelsPreview() {
    var B = ML.book[ML.sheet], L = ML.L, headers = L.headers.length ? L.headers : (B.rows[0] || []).map(function (x, i) { return 'Column ' + (i + 1); });
    var rows = L.num >= 0 ? C.readModelList(B.rows, L) : [];
    ML.rows = rows;
    openModal('<h2><span>⬆ Model list</span><button class="icon" data-close>×</button></h2><p class="small">' + esc(ML.file) + ' — check the columns.</p>' +
      '<div class="form"><label>Sheet<select id="mlSheet">' + Object.keys(ML.book).map(function (n) { return '<option' + (n === ML.sheet ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') + '</select></label>' +
      '<label>Model number *' + colSel('mlNum', L.num, headers, true) + '</label><label>Model name' + colSel('mlName', L.name, headers, true) + '</label>' +
      '<label>Building' + colSel('mlBld', L.bld, headers, true) + '</label><label>Typology' + colSel('mlTypo', L.typology, headers, true) + '</label><label>Levels' + colSel('mlLvl', L.levels, headers, true) + '</label></div>' +
      '<p style="margin:10px 0 4px"><b>' + rows.length + '</b> models found</p><div class="tw"><table class="t"><tr><th>Model</th><th>Name</th><th>Building</th><th>Typology</th><th>Levels</th></tr>' +
      rows.slice(0, 8).map(function (m) { return '<tr><td class="mono">' + esc(m.num) + '</td><td>' + esc(m.name) + '</td><td>' + esc(m.bld) + '</td><td>' + esc(m.typology) + '</td><td>' + esc(m.levels) + '</td></tr>'; }).join('') + '</table></div>' +
      '<div class="foot"><span class="small">Replaces the previous model list.</span><span style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-act="mlImport"' + (rows.length ? '' : ' disabled') + '>Import ' + rows.length + ' models</button></span></div>');
  }
  function modelsReread() {
    var sh = $('mlSheet').value;
    if (sh !== ML.sheet) { ML.sheet = sh; ML.L = C.detectModelLayout(ML.book[sh].rows); return modelsPreview(); }
    if (ML.L.headerRow < 0) ML.L.headerRow = 0;
    ML.L.num = +$('mlNum').value; ML.L.name = +$('mlName').value; ML.L.bld = +$('mlBld').value; ML.L.typology = +$('mlTypo').value; ML.L.levels = +$('mlLvl').value;
    modelsPreview();
  }

  /* --- Submission lists --- */
  var SB = null;
  function subFiles(files) {
    files = Array.prototype.slice.call(files);
    var excel = files.filter(function (f) { return /\.(xlsx|xlsm|xls|csv)$/i.test(f.name); });
    var g = C.guessFromFileName(files[0].name);
    var fromNames = files.filter(function (f) { return !/\.(xlsx|xlsm|xls|csv)$/i.test(f.name); }).map(function (f) { return [f.name]; });
    var p = excel.length ? Promise.all(excel.map(readBook)).then(function (books) {
      var rows = fromNames.slice(); books.forEach(function (b) { Object.keys(b).forEach(function (n) { rows = rows.concat(b[n].rows); }); }); return rows;
    }) : Promise.resolve(fromNames);
    p.then(function (rows) {
      var items = C.readSubmission(rows);
      SB = { items: items, file: files.length === 1 ? files[0].name : files.length + ' files' };
      var match = items.filter(function (it) { return IX.byKey[it.key]; }).length;
      openModal('<h2><span>📦 New submission</span><button class="icon" data-close>×</button></h2>' +
        '<div class="form"><label>Name<input id="sbName" value="' + esc(g.name) + '" placeholder="e.g. PTA #3"></label><label>Date sent<input id="sbDate" type="date" value="' + esc(g.date || todayIso()) + '"></label></div>' +
        '<p><b>' + items.length + '</b> drawings found · <b class="ok">' + match + '</b> in the MIDP' + (items.length - match ? ' · <b class="warn">' + (items.length - match) + '</b> not in the MIDP' : '') + '</p>' +
        '<div class="tw"><table class="t"><tr><th>Drawing</th><th>Rev in list</th><th>MIDP rev</th></tr>' + items.slice(0, 300).map(function (it) {
          var d = IX.byKey[it.key];
          return '<tr><td class="mono">' + esc(it.key) + '</td><td class="mono">' + esc(it.rev || '—') + '</td><td class="mono ' + (!d ? 'warn' : '') + '">' + (d ? esc(d.rev || '—') : 'not in MIDP') + '</td></tr>';
        }).join('') + '</table></div>' +
        '<p class="small">This only adds history. The revision shown stays the MIDP\'s.</p>' +
        '<div class="foot"><span></span><span style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-act="sbSave"' + (items.length ? '' : ' disabled') + '>Save submission</button></span></div>');
    }).catch(function (e) { toast('⚠ ' + e.message); });
  }

  /* ===== 5. Changes you make ===== */
  function setOverride(kind, key, val) {
    var o = S.overrides[kind];
    if (val) o[key] = val; else delete o[key];
    log((val ? 'Set ' : 'Cleared ') + kind + ' for ' + key + (val ? ': ' + val : ''));
    save(); render(); refreshDetail();
  }
  function ruleModal(fromKey) {
    var d = fromKey ? IX.byKey[fromKey] : null;
    var opt = function (arr, cur) { return '<option value="">any</option>' + arr.map(function (x) { return '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); };
    var uniq = function (f) { var o = {}; IX.drawings.forEach(function (x) { o[f(x)] = 1; }); return Object.keys(o).filter(Boolean).sort(); };
    openModal('<h2><span>+ Model rule</span><button class="icon" data-close>×</button></h2><p class="small">Leave a box empty for "any". The rule sets the model for every drawing that fits.</p>' +
      '<div class="form"><label>Building code<select id="rBld">' + opt(uniq(function (x) { return x.bld; }), d && d.bld) + '</select></label>' +
      '<label>Level code<select id="rLvl">' + opt(uniq(function (x) { return x.lvl; }), d && d.lvl !== 'ZZ' ? d.lvl : '') + '</select></label>' +
      '<label>Type<select id="rType">' + opt(uniq(function (x) { return x.type; }), '') + '</select></label>' +
      '<label>Section contains<input id="rSec" value="' + esc(d ? d.section : '') + '"></label><label>Title / typology contains<input id="rText"></label>' +
      '<label>Number from<input id="rFrom" inputmode="numeric"></label><label>Number to<input id="rTo" inputmode="numeric"></label>' +
      '<label>→ Model *<select id="rModel"><option value="">— pick —</option>' + IX.models.map(function (m) { return '<option value="' + esc(m.num) + '"' + (d && d.model.num === m.num ? ' selected' : '') + '>' + esc(m.name || m.num) + '</option>'; }).join('') + '</select></label></div>' +
      '<p class="small" id="rCount"></p><div class="foot"><span></span><span style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-act="ruleSave">Save rule</button></span></div>');
    var count = function () {
      var r = ruleFromForm(), n = IX.drawings.filter(function (x) { return ruleHitsUI(r, x); }).length;
      $('rCount').textContent = n + ' drawing(s) fit this rule now.';
    };
    $('modalCard').addEventListener('input', count); $('modalCard').addEventListener('change', count); count();
  }
  function ruleFromForm() { return { bld: $('rBld').value, lvl: $('rLvl').value, type: $('rType').value, section: $('rSec').value.trim(), text: $('rText').value.trim(), seqFrom: $('rFrom').value.trim(), seqTo: $('rTo').value.trim(), model: $('rModel').value }; }
  function ruleHitsUI(r, d) {
    var U = function (x) { return String(x || '').toUpperCase(); };
    if (r.bld && U(r.bld) !== U(d.bld)) return false; if (r.lvl && U(r.lvl) !== U(d.lvl)) return false; if (r.type && U(r.type) !== U(d.type)) return false;
    if (r.section && U(d.section).indexOf(U(r.section)) < 0) return false;
    if (r.text && (U(d.title) + ' ' + U(d.typology.name)).indexOf(U(r.text)) < 0) return false;
    if (r.seqFrom && +d.seq < +r.seqFrom) return false; if (r.seqTo && +d.seq > +r.seqTo) return false;
    return true;
  }
  function exportExcel() {
    if (!S.midp) return toast('Upload the MIDP first');
    loadXLSX().then(function () {
      var wb = XLSX.utils.book_new();
      var rows = IX.drawings.map(function (d) {
        return { 'Drawing number': d.key, 'MIDP rev': d.rev, 'Title': d.title, 'Building': d.bldName, 'Level': d.lvlName, 'Type': d.type, 'Section': d.section,
          'Typology': d.typology.name, 'Typology from': d.typology.why, 'Model': d.model.num, 'Model name': modelLabel(d.model.num), 'Model from': d.model.why, 'Model sure?': d.model.conf,
          'Last submission': d.lastSub ? d.lastSub.sub : '', 'Sent on': d.lastSub ? d.lastSub.date : '', 'Rev in that list': d.lastSub ? d.lastSub.rev : '',
          'Next MIDP date': d.next ? d.next.name + ' ' + d.next.date : '', 'Due, not sent': d.overdue ? d.overdue.name + ' ' + d.overdue.date : '', 'Warnings': d.flags.join(' | ') };
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Register');
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(IX.models.map(function (m) { return { 'Model': m.num, 'Name': m.name, 'Buildings': Object.keys(m.blds).join(', '), 'Levels': Object.keys(m.levels2).join(', '), 'Typologies': Object.keys(m.typos).join(', '), 'Drawings': m.drawings.length, 'Sent': m.sent }; })), 'Models');
      var hist = []; IX.drawings.forEach(function (d) { d.history.forEach(function (h) { hist.push({ 'Drawing number': d.key, 'Submission': h.sub, 'Date': h.date, 'Rev in list': h.rev, 'Note': h.note, 'MIDP rev now': d.rev }); }); });
      if (hist.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hist), 'Submission history');
      if ((S.midp.issues || []).length) XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(S.midp.issues.map(function (x) { return { 'MIDP row': x.row, 'Drawing': x.key || '', 'Problem': x.text }; })), 'MIDP problems');
      var p = project();
      XLSX.writeFile(wb, ((p.code || p.name || 'Project') + '_Register_' + todayIso()).replace(/[^A-Za-z0-9_-]+/g, '_') + '.xlsx');
    }).catch(function (e) { toast('⚠ ' + e.message); });
  }

  /* ===== 6. Wiring ===== */
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-tab],[data-open],[data-chip],[data-all],[data-close],[data-settypo],[data-cleartypo],[data-setmodel],[data-clearmodel],[data-rulefrom],[data-subdel],[data-subedit],[data-ruledel],[data-ruleup]');
    if (!el) { if (e.target === $('modal')) closeModal(); return; }
    var a = function (k) { return el.getAttribute(k); };
    if (el.hasAttribute('data-tab')) { UI.tab = a('data-tab'); saveUI(); closeDetail(); render(); return; }
    if (el.hasAttribute('data-open')) { e.preventDefault(); openDetail(a('data-open')); return; }
    if (el.hasAttribute('data-chip')) { UI.chip = a('data-chip'); saveUI(); render(); return; }
    if (el.hasAttribute('data-all')) { UI.showAll[a('data-all')] = !UI.showAll[a('data-all')]; render(); return; }
    if (el.hasAttribute('data-close')) { if (el.closest('#drawer')) closeDetail(); else closeModal(); return; }
    if (el.hasAttribute('data-settypo')) return setOverride('typo', a('data-settypo'), $('pTypo').value.trim().toUpperCase());
    if (el.hasAttribute('data-cleartypo')) return setOverride('typo', a('data-cleartypo'), '');
    if (el.hasAttribute('data-setmodel')) return setOverride('model', a('data-setmodel'), $('pModel').value);
    if (el.hasAttribute('data-clearmodel')) return setOverride('model', a('data-clearmodel'), '');
    if (el.hasAttribute('data-rulefrom')) { e.preventDefault(); return ruleModal(a('data-rulefrom')); }
    if (el.hasAttribute('data-subdel')) { var s = S.subs.filter(function (x) { return x.id === a('data-subdel'); })[0]; if (s && confirm('Remove submission "' + s.name + '"?')) { S.subs = S.subs.filter(function (x) { return x !== s; }); log('Removed submission ' + s.name); save(); render(); } return; }
    if (el.hasAttribute('data-subedit')) {
      var s2 = S.subs.filter(function (x) { return x.id === a('data-subedit'); })[0]; if (!s2) return;
      var nm = prompt('Submission name', s2.name); if (nm === null) return;
      var dt = prompt('Date sent (YYYY-MM-DD)', s2.date); if (dt === null) return;
      s2.name = nm.trim() || s2.name; if (/^\d{4}-\d{2}-\d{2}$/.test(dt.trim())) s2.date = dt.trim();
      save(); render(); return;
    }
    if (el.hasAttribute('data-ruledel')) { S.rules.splice(+a('data-ruledel'), 1); save(); render(); return; }
    if (el.hasAttribute('data-ruleup')) { var i = +a('data-ruleup'), r = S.rules.splice(i, 1)[0]; S.rules.splice(i - 1, 0, r); save(); render(); return; }
    switch (a('data-act')) {
      case 'upMidp': $('fMidp').click(); break;
      case 'upModels': $('fModels').click(); break;
      case 'upSub': if (!S.midp) toast('Upload the MIDP first'); else $('fSub').click(); break;
      case 'export': exportExcel(); break;
      case 'midpImport': midpImport(); break;
      case 'mlImport': S.models = { file: ML.file, at: now(), rows: ML.rows }; log('Model list ' + ML.file + ': ' + ML.rows.length); save(); closeModal(); render(); toast('✓ ' + ML.rows.length + ' models'); ML = null; break;
      case 'clearModels': if (confirm('Remove the model list?')) { S.models = null; save(); render(); } break;
      case 'sbSave':
        var name = $('sbName').value.trim() || 'Submission', date = $('sbDate').value || todayIso();
        S.subs.push({ id: uid(), name: name, date: date, file: SB.file, added: Date.now(), items: SB.items });
        log('Submission ' + name + ' (' + SB.items.length + ' drawings)'); save(); closeModal(); render(); toast('✓ ' + name + ' saved'); SB = null; break;
      case 'acceptModels': if (confirm('Accept all likely models? You can still change any of them.')) { IX.drawings.forEach(function (d) { if (d.model.conf === 'likely' && d.model.num) S.overrides.model[d.key] = d.model.num; }); log('Accepted likely models'); save(); render(); } break;
      case 'acceptTypos': if (confirm('Accept all likely typologies?')) { IX.drawings.forEach(function (d) { if (d.typology.conf === 'likely' && d.typology.name) S.overrides.typo[d.key] = d.typology.name; }); log('Accepted likely typologies'); save(); render(); } break;
      case 'newRule': ruleModal(null); break;
      case 'ruleSave': var rr = ruleFromForm(); if (!rr.model) { toast('Pick the model'); return; } S.rules.push(rr); log('Rule: ' + C.ruleLabel(rr)); save(); closeModal(); render(); toast('Rule saved'); break;
      case 'addCode': var c = (prompt('Building code (as in the drawing number, e.g. T3)') || '').trim().toUpperCase(); if (c) { S.codes[c] = c; save(); render(); } break;
      case 'saveCodes': document.querySelectorAll('[data-code]').forEach(function (x) { S.codes[x.getAttribute('data-code')] = x.value.trim() || x.getAttribute('data-code'); }); save(); render(); toast('Saved'); break;
      case 'clearAll': if (confirm('Clear ALL register data for this project?')) { localStorage.removeItem(KEY); S = load(); save(); render(); } break;
    }
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'fMidp' && t.files[0]) { midpFile(t.files[0]); t.value = ''; }
    else if (t.id === 'fModels' && t.files[0]) { modelsFile(t.files[0]); t.value = ''; }
    else if (t.id === 'fSub' && t.files.length) { subFiles(t.files); t.value = ''; }
    else if (/^mp(Sheet|Num|Title|Rev|Status)$/.test(t.id)) midpReread();
    else if (/^ml(Sheet|Num|Name|Bld|Typo|Lvl)$/.test(t.id)) modelsReread();
    else if (t.id === 'monthFirst') { S.settings.monthFirst = t.checked; save(); toast('Applies to the next MIDP upload'); }
  });
  var qT;
  document.addEventListener('input', function (e) { if (e.target.id !== 'q') return; clearTimeout(qT); qT = setTimeout(function () { UI.q = e.target.value; saveUI(); render(); }, 160); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if ($('modal').classList.contains('show')) closeModal(); else closeDetail(); } });
  window.addEventListener('storage', function (e) { if (e.key === KEY || e.key === 'lt_projects_v1') { S = load(); render(); } });
  if (window.LTTheme) LTTheme.onChange(function (th) { $('themeBtn').textContent = th.mode === 'light' ? '🌙' : '☀'; });
  $('themeBtn').onclick = function () { if (window.LTTheme) LTTheme.toggleMode(); };
  window.__register = { state: function () { return S; }, index: function () { return IX; }, render: render, openDetail: openDetail };   // for tests
  render();
})();
</script>
</body>
</html>
